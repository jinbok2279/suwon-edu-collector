name: libs

on:
  schedule:
    - cron: "40 20 * * 0"   # 한국시간 매주 월요일 05:40
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: libs
  cancel-in-progress: false

jobs:
  libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python libs.py
        env:
          LIB_KEY: ${{ secrets.LIB_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/data && cp output/libs.json docs/data/
          git add output/libs.json docs/data/libs.json
          git diff --cached --quiet && exit 0
          git commit -m "도서관 목록 업데이트"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
