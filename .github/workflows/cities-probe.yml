name: cities-probe
on:
  push:
    branches: [cities]
    paths: ["probe/probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python probe/probe.py
        env:
          LIB_KEY: ${{ secrets.LIB_KEY }}
          WEATHER_KEY: ${{ secrets.WEATHER_KEY }}
          KINDER_KEY: ${{ secrets.KINDER_KEY }}
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/out && git commit -m "성남 점검 결과" && git push origin HEAD:cities
